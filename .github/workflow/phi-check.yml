name: PHI check

# Blocks any push or pull request that introduces patient-level MIMIC-III data.
# Unlike a local pre-commit hook, this travels with the repository.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF reader
        run: pip install --quiet pdfplumber

      - name: Scan repository for patient-level data
        run: python3 tools/check_phi.py .
